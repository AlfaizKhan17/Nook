name: nook
description: Nook campus community and Lost & Found application
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  supabase_flutter: ^2.10.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/nook_icon

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/nook_icon.png"